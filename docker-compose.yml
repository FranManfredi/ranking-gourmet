services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: ${PORT}
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_BASE_URL: ${BETTER_AUTH_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
      INITIAL_USER_NAME: ${INITIAL_USER_NAME:-Admin}
      INITIAL_USER_SURNAME: ${INITIAL_USER_SURNAME:-}
      INITIAL_USER_ROLE: ${INITIAL_USER_ROLE:-admin}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    platform: linux/amd64
    build:
      context: ./apps/frontend
    container_name: ranking-gourmet-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      BACKEND_API_URL: ${BACKEND_API_URL}
      BETTER_AUTH_BACKEND_URL: ${BETTER_AUTH_BACKEND_URL}
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL}
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - "3000:3000"

volumes:
  postgres_data:
